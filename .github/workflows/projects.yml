# projects.yml
# List of repositories to feature as project cards on the profile README.
# fetch_data.py reads this file, pulls live metadata from the GitHub API for
# each entry, and writes the merged result to projects.json.
#
# Fields:
#   repo         (required) "owner/repo" on GitHub
#   path         (optional) subfolder within the repo this project lives in,
#                for mono-repos like Krishna-s/Echoes
#   name         (optional) display name override (defaults to repo name, or
#                the last segment of `path` if set)
#   emoji        (optional) icon shown on the card (default: "📦")
#   tagline      (optional) short description override, used when the repo
#                has no description set on GitHub, or to shorten a long one

username: KrishnaSaiTejaSandalla

projects:
  - repo: KrishnaSaiTejaSandalla/Edupredict
    emoji: "🎓"
    tagline: "AI-assisted education platform built with Next.js, Drizzle ORM & Tailwind"

  - repo: KrishnaSaiTejaSandalla/NorthPeak-Digital
    emoji: "🏔️"
    tagline: "Modern digital agency / business website"

  - repo: KrishnaSaiTejaSandalla/Spotify-clone
    emoji: "🎵"
    tagline: "Spotify-inspired music player UI built with React, Tailwind CSS & Context API"

  - repo: KrishnaSaiTejaSandalla/nike-store
    emoji: "👟"
    tagline: "Nike-inspired e-commerce storefront UI"

  - repo: KrishnaSaiTejaSandalla/Krishna-s
    path: Echoes
    name: Echoes
    emoji: "🌀"
    tagline: "Echoes — a project housed inside the Krishna-s repository"
